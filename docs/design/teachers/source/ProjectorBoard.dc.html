<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>教室に映す（黒板に投影）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
</style>
</helmet>
<div style="width: 1600px; height: 900px; background: #000000">
  <dc-import name="Projector" surface="board" start-step="{{startStep}}" hint-size="1600px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startStep":{"editor":"enum","options":["1","2","3"],"default":"2"},"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { startStep: this.props.startStep ?? '2' };
  }
}
</script>
</body>
</html>
