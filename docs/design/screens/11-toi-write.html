<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>はてなを かく｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 10px; height: 56px">
    <a href="08-check.html" aria-label="もどる" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-white); box-shadow: var(--shadow-pop-xs); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div role="img" aria-label="つかまえた ところ" style="width: 54px; height: 54px; flex-shrink: 0">
      <svg aria-hidden="true" width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="24" fill="#EAF0F8" stroke="#FFC83D" stroke-width="5"></circle><circle cx="27" cy="27" r="24" fill="none" stroke="#22223A" stroke-width="2"></circle><rect x="9" y="20" width="36" height="14" rx="7" fill="#3B3F52"></rect><circle cx="37" cy="27" r="4" fill="#F0444F"></circle></svg>
    </div>
    <h1 style="margin: 0; font-family: var(--font-pop); font-weight: 400; font-size: 20px">しんごうの はてな</h1>
  </div>

  <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-white)">
    <a href="10-toi3.html" role="tab" aria-selected="false" style="height: 48px; border-radius: 20px; color: var(--color-ink-sub); font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center; text-decoration: none">3つから えらぶ</a>
    <a href="11-toi-write.html" role="tab" aria-selected="true" style="height: 48px; border-radius: 20px; background: var(--color-navi); color: var(--color-white); font-family: var(--font-pop); font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">じぶんで かく</a>
  </div>

  <div style="display: flex; align-items: center; gap: 12px">
    <img src="../assets/navi/navi-think.png" alt="ナビ（はてな）" style="width: 86px; height: 86px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 10px 16px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-white); box-shadow: var(--shadow-pop-sm); font-size: 21px; font-weight: 900; line-height: 1.7">
      <div style="position: absolute; left: -11px; top: calc(50% - 9px); width: 16px; height: 16px; background: var(--color-white); border-left: 3px solid var(--color-ink); border-bottom: 3px solid var(--color-ink); transform: rotate(45deg)"></div>
      しんごうの なにが<br><ruby>気<rt>き</rt></ruby>になる？
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="q" style="font-family: var(--font-pop); font-size: 18px">はてなを かこう</label>
    <textarea id="q" rows="3" placeholder="れい：しんごうは 1にちに なんかい かわる？" style="height: 150px; box-sizing: border-box; padding: 16px 18px; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-white); box-shadow: var(--shadow-pop-md); font-family: inherit; font-size: 21px; font-weight: 900; line-height: 1.6; color: var(--color-ink); resize: none"></textarea>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 6px">
    <span style="font-size: 15px; font-weight: 900; color: var(--color-ink-sub)">こんな ことばから はじめてみよう</span>
    <div style="display: flex; flex-wrap: wrap; gap: 10px">
      <button type="button" data-add="なんかい？" style="height: 50px; padding: 0 18px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-navi-light); box-shadow: var(--shadow-pop-sm); color: var(--color-ink); font-family: var(--font-body); font-size: 18px; font-weight: 900; cursor: pointer">なんかい？</button>
        <button type="button" data-add="どっちが おおきい？" style="height: 50px; padding: 0 18px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-pink-light); box-shadow: var(--shadow-pop-sm); color: var(--color-ink); font-family: var(--font-body); font-size: 18px; font-weight: 900; cursor: pointer">どっちが おおきい？</button>
        <button type="button" data-add="なぜ？" style="height: 50px; padding: 0 18px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-mint-light); box-shadow: var(--shadow-pop-sm); color: var(--color-ink); font-family: var(--font-body); font-size: 18px; font-weight: 900; cursor: pointer">なぜ？</button>
    </div>
  </div>

  <a href="12-yoso.html" style="margin-top: auto; margin-bottom: 6px; height: 72px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-navi); box-shadow: var(--shadow-pop); color: var(--color-white); font-family: var(--font-pop); font-size: 23px; display: flex; align-items: center; justify-content: center; text-decoration: none">この はてなで いく！</a>
</div>
<script src="../screen.js"></script>
<script>
var textarea = document.getElementById('q');
document.querySelectorAll('[data-add]').forEach(function (b) {
  b.addEventListener('click', function () { textarea.value = 'しんごうは ' + b.dataset.add; textarea.focus(); });
});
</script>
</body>
</html>
