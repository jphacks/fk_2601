<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>せってい｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">

</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 14px">
  <h1 style="margin: 0; height: 46px; display: flex; align-items: center; font-family: var(--font-pop); font-weight: 400; font-size: 26px">せってい</h1>

  <div style="padding: 14px 16px; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-white); box-shadow: var(--shadow-pop-md); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 17px; font-weight: 900; color: var(--color-ink-sub)">ニックネーム</span>
      <span style="font-family: var(--font-pop); font-size: 20px">そら</span>
    </div>
    <span style="font-family: var(--font-pop); font-size: 20px; line-height: 1.6"><ruby>学年<rt>がくねん</rt></ruby></span>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <button type="button" class="grade sm" data-c="1" aria-pressed="false" aria-label="1ねんせい">1</button>
        <button type="button" class="grade sm" data-c="2" aria-pressed="false" aria-label="2ねんせい">2</button>
        <button type="button" class="grade sm" data-c="3" aria-pressed="false" aria-label="3ねんせい">3</button>
        <button type="button" class="grade sm" data-c="4" aria-pressed="false" aria-label="4ねんせい">4</button>
        <button type="button" class="grade sm" data-c="5" aria-pressed="true" aria-label="5ねんせい">5</button>
        <button type="button" class="grade sm" data-c="6" aria-pressed="false" aria-label="6ねんせい">6</button>
    </div>
  </div>

  <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
    <legend style="padding: 0; margin-bottom: 10px; font-family: var(--font-pop); font-size: 18px">はてなの だしかた</legend>
    <button type="button" class="radio" aria-pressed="true"><span class="radio-dot"></span>「3つから えらぶ」を さきに</button>
    <button type="button" class="radio" aria-pressed="false"><span class="radio-dot"></span>「じぶんで かく」を さきに</button>
  </fieldset>

  <a href="20-zukan.html" style="display: flex; align-items: center; gap: 10px; height: 62px; padding: 0 16px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-white); box-shadow: var(--shadow-pop-sm); text-decoration: none; color: var(--color-ink)">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFC83D" stroke="#22223A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8" fill="#FF6F9C"></path></svg>
    <span style="font-size: 17px; font-weight: 900">しょうごう</span>
    <span style="margin-left: auto; padding: 2px 10px; border: 2px solid var(--color-ink); border-radius: 12px; background: var(--color-purple); color: var(--color-white); font-size: 14px; font-weight: 900">エンジニアレベル</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
  </a>

  <a href="02-login.html" style="height: 56px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-pink-light); box-shadow: var(--shadow-pop-sm); color: var(--color-pink-dark); font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; text-decoration: none">ログアウト</a>

  <nav style="margin: auto -24px -24px; height: 84px; flex-shrink: 0; box-sizing: border-box; border-top: 3px solid var(--color-ink); background: var(--color-white); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="04-home.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 58px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></span>ホーム</a>
    <a href="20-zukan.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 58px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"></path><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"></path></svg></span>ずかん</a>
    <a href="21-minna.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 58px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16.5 14.2c2.9.3 5 2.5 5 5.8"></path></svg></span>みんな</a>
    <a href="22-settings.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-mint-dark); font-size: 14px; font-weight: 900"><span style="width: 58px; height: 34px; border-radius: 17px; background: var(--color-mint-light); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0F7A63" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></span>せってい</a>
  </nav>
</div>
<script src="../screen.js"></script>
<script>
group('.grade', 'aria-pressed');
group('.radio', 'aria-pressed');
</script>
</body>
</html>
