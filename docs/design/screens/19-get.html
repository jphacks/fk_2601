<html lang="ja">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px">
    <img src="../assets/navi/navi-smile.png" alt="ナビ（にこにこ）" style="width: 70px; height: 70px">
    <h1 style="margin: 0; font-family: var(--font-pop); font-weight: 400; font-size: 34px; color: var(--color-yellow); -webkit-text-stroke: 2px var(--color-ink)">はてなゲット！</h1>
  </div>

  <div style="align-self: center; width: 300px; padding: 8px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 28px; background: var(--color-purple); box-shadow: var(--shadow-pop); transform: rotate(-3deg)">
    <div style="position: relative; border: 3px solid var(--color-ink); border-radius: 20px; background: var(--color-white); overflow: hidden">
      <div role="img" aria-label="しんごうの しゃしん" style="height: 112px; background: var(--color-photo); border-bottom: 3px solid var(--color-ink); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" viewBox="10 30 220 110" width="170" height="85"><rect x="16" y="44" width="208" height="76" rx="38" fill="#3B3F52"></rect><circle cx="58" cy="82" r="24" fill="#5B6074"></circle><circle cx="120" cy="82" r="24" fill="#5B6074"></circle><circle cx="182" cy="82" r="24" fill="#F0444F"></circle></svg>
      </div>
      <div style="padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="align-self: flex-start; padding: 2px 10px; border: 2px solid var(--color-ink); border-radius: 10px; background: var(--color-purple-light); color: var(--color-purple-dark); font-size: 13px; font-weight: 900">じょうほう ・ じかんと かいすう</span>
        <span style="font-size: 18px; font-weight: 900; line-height: 1.45">しんごうは 1にちに なんかい あかに なる？</span>
        <span style="font-family: var(--font-pop); font-size: 15px">きみ 100 → <span style="color: var(--color-navi-dark)">こたえ 720</span></span>

      <svg role="img" aria-label="おおはずれの はんこ" width="74" height="74" viewBox="0 0 112 112" style="position: absolute; right: 6px; top: 70px; transform: rotate(14deg)"><circle cx="56" cy="56" r="50" fill="#FFFFFF" stroke="#4A5AE8" stroke-width="7"></circle><circle cx="56" cy="56" r="41" fill="none" stroke="#4A5AE8" stroke-width="3"></circle><text x="56" y="63" text-anchor="middle" font-family="Mochiy Pop One, sans-serif" font-size="19" fill="#4A5AE8">大はずれ</text></svg>
    </div>
  </div>

  <div style="margin-top: 8px; padding: 12px 16px; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-purple-light); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: var(--font-pop); font-size: 17px; color: var(--color-purple-dark)">じょうほう スタンプ</span>
      <span style="font-family: var(--font-pop); font-size: 17px; color: var(--color-purple-dark)">5/5 そろった！</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; justify-items: center">
      <span style="width: 46px; height: 46px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-purple)"></span>
      <span style="width: 46px; height: 46px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-purple)"></span>
      <span style="width: 46px; height: 46px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-purple)"></span>
      <span style="width: 46px; height: 46px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-purple)"></span>
      <span style="width: 46px; height: 46px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-yellow); box-shadow: 0 0 0 5px var(--color-white), 0 0 0 8px var(--color-ink); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#22223A" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-purple); box-shadow: var(--shadow-pop-md); color: var(--color-white)">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="#FFC83D" stroke="#22223A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8" fill="#FF6F9C"></path></svg>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 15px; font-weight: 900">しょうごう ゲット！</span>
      <span style="font-family: var(--font-pop); font-size: 22px">エンジニアレベル</span>
    </div>
  </div>

  <div style="display: flex; gap: 10px; margin-top: auto; margin-bottom: 6px">
    <a href="20-zukan.html" style="flex: 1 1 0; height: 68px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-white); box-shadow: var(--shadow-pop-md); color: var(--color-ink); font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; text-decoration: none">ずかんを みる</a>
    <a href="05-camera.html" style="flex: 1.2 1 0; height: 68px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-navi); box-shadow: var(--shadow-pop-md); color: var(--color-white); font-family: var(--font-pop); font-size: 19px; display: flex; align-items: center; justify-content: center; text-decoration: none">もっと さがす！</a>
