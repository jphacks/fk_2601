<!doctype html>
<html lang="ja">
<head>

<title>つかまえる（囲む）｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">

</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 10px; height: 52px">
    <a href="05-camera.html" aria-label="もどる" style="width: 50px; height: 50px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-white); box-shadow: var(--shadow-pop-xs); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: var(--font-pop); font-weight: 400; font-size: 22px">ぐるっと つかまえよう！</h1>
  </div>

  <div role="img" aria-label="しんごうを ゆびで かこんだ わっか" style="position: relative; height: 400px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 32px; background: var(--color-photo); overflow: hidden; display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" viewBox="0 0 240 320" width="240" height="320"><rect x="112" y="118" width="16" height="200" rx="4" fill="#B7BCCD"></rect><rect x="16" y="44" width="208" height="76" rx="38" fill="#3B3F52"></rect><circle cx="58" cy="82" r="24" fill="#5B6074"></circle><circle cx="120" cy="82" r="24" fill="#5B6074"></circle><circle cx="182" cy="82" r="24" fill="#F0444F"></circle></svg>
    <svg aria-hidden="true" width="336" height="394" viewBox="0 0 336 394" style="position: absolute; left: 0; top: 0"><path d="M104 70C176 50 290 58 296 112C302 166 240 186 170 186C100 186 44 166 46 120C48 88 78 74 116 66C124 64 130 58 134 46" fill="#4A5AE8" fill-opacity="0.14" stroke="#FFC83D" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"></path><path d="M104 70C176 50 290 58 296 112C302 166 240 186 170 186C100 186 44 166 46 120C48 88 78 74 116 66C124 64 130 58 134 46" fill="none" stroke="#4A5AE8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M300 42l5 10 11 2-8 7 2 11-10-6-10 6 2-11-8-7 11-2z" fill="#FFC83D" stroke="#22223A" stroke-width="2.5" stroke-linejoin="round"></path><circle cx="28" cy="214" r="7" fill="#FF6F9C" stroke="#22223A" stroke-width="2.5"></circle><path d="M300 210q7-9 14 0t14 0" fill="none" stroke="#24C3A0" stroke-width="4" stroke-linecap="round"></path></svg>
    <img src="../assets/navi/navi-smile.png" alt="" style="position: absolute; left: 132px; top: 2px; width: 54px; height: 54px">
  </div>

  <div style="display: flex; align-items: center; gap: 12px">
    <img src="../assets/navi/navi-smile.png" alt="ナビ（にこにこ）" style="width: 84px; height: 84px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 12px 16px; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-white); box-shadow: var(--shadow-pop-sm); font-size: 21px; font-weight: 900; line-height: 1.65">
      <div style="position: absolute; left: -11px; top: calc(50% - 9px); width: 16px; height: 16px; background: var(--color-white); border-left: 3px solid var(--color-ink); border-bottom: 3px solid var(--color-ink); transform: rotate(45deg)"></div>
      <ruby>気<rt>き</rt></ruby>になる ところを<br>ゆびで ぐるっと！
    </div>
  </div>

  <div style="display: flex; gap: 10px">
    <button type="button" style="flex: 1 1 0; height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-white); box-shadow: var(--shadow-pop-sm); color: var(--color-ink); font-family: inherit; font-size: 18px; font-weight: 900; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
      もどす
    </button>
    <a href="05-camera.html" style="flex: 1 1 0; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-white); box-shadow: var(--shadow-pop-sm); color: var(--color-ink); font-size: 18px; font-weight: 900; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13.5" r="3.5"></circle></svg>
      とりなおす
    </a>
  </div>

  <a href="07-wait.html" style="margin-top: auto; margin-bottom: 6px; height: 72px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-navi); box-shadow: var(--shadow-pop); color: var(--color-white); font-family: var(--font-pop); font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5c6-2 11 1 11 6s-5 7-10 7S3 15 3 11c0-2.5 2-4.5 5-5.5 1-.3 1.6-1.2 1.4-2.5"></path></svg>
    つかまえる！
  </a>
</div>

</html>
