<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>はてなずかん｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 8px; height: 50px">
    <h1 style="margin: 0; font-family: var(--font-pop); font-weight: 400; font-size: 24px">はてなずかん</h1>
    <span style="padding: 2px 10px; border: 2.5px solid var(--color-ink); border-radius: 12px; background: var(--color-yellow); font-family: var(--font-pop); font-size: 14px">9こ</span>
    <button type="button" style="margin-left: auto; height: 44px; padding: 0 12px; border: 2.5px solid var(--color-ink); border-radius: 16px; background: var(--color-white); box-shadow: var(--shadow-pop-xs); color: var(--color-ink); font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer">えらんで けす</button>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-purple); box-shadow: var(--shadow-pop-sm); color: var(--color-white)">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="#FFC83D" stroke="#22223A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8" fill="#FF6F9C"></path></svg>
    <span style="font-size: 14px; font-weight: 900">いまの しょうごう</span>
    <span style="margin-left: auto; font-family: var(--font-pop); font-size: 18px">エンジニアレベル</span>
  </div>

  <div style="padding: 10px 14px 12px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-navi-light); display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: var(--font-pop); font-size: 20px; color: var(--color-navi-dark); line-height: 1.6"><ruby>算数<rt>さんすう</rt></ruby></span>
      <span style="font-family: var(--font-pop); font-size: 16px; color: var(--color-navi-dark)">3/5</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); justify-items: center">
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-navi)"></span>
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-navi)"></span>
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-navi)"></span>
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 2.5px dashed var(--color-ink-muted); border-radius: 50%; background: var(--color-white)"></span>
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 2.5px dashed var(--color-ink-muted); border-radius: 50%; background: var(--color-white)"></span>
    </div>
    <span style="font-size: 14px; font-weight: 900; color: var(--color-navi-dark)">あと 2こで「すうがく はかせ」</span>
  </div>

  <div style="padding: 10px 14px 12px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-mint-light); display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: var(--font-pop); font-size: 20px; color: var(--color-mint-dark); line-height: 1.6"><ruby>理科<rt>りか</rt></ruby></span>
      <span style="font-family: var(--font-pop); font-size: 16px; color: var(--color-mint-dark)">1/5</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); justify-items: center">
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-mint)"></span>
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 2.5px dashed var(--color-ink-muted); border-radius: 50%; background: var(--color-white)"></span>
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 2.5px dashed var(--color-ink-muted); border-radius: 50%; background: var(--color-white)"></span>
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 2.5px dashed var(--color-ink-muted); border-radius: 50%; background: var(--color-white)"></span>
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 2.5px dashed var(--color-ink-muted); border-radius: 50%; background: var(--color-white)"></span>
    </div>
    <span style="font-size: 14px; font-weight: 900; color: var(--color-mint-dark)">あと 4こで「りか マスター」</span>
  </div>

  <div style="padding: 10px 14px 12px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-purple-light); box-shadow: var(--shadow-pop-sm); display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: var(--font-pop); font-size: 20px; color: var(--color-purple-dark); line-height: 1.6"><ruby>情報<rt>じょうほう</rt></ruby></span>
      <span style="font-family: var(--font-pop); font-size: 16px; color: var(--color-purple-dark)">5/5 コンプリート！</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); justify-items: center">
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-purple)"></span>
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-purple)"></span>
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-purple)"></span>
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-purple)"></span>
      <span style="width: 44px; height: 44px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-yellow); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#22223A" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></span>
    </div>
  </div>

  <a href="18-moshimo.html" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-white); box-shadow: var(--shadow-pop-sm); text-decoration: none; color: var(--color-ink)">
    <span role="img" aria-label="しんごうの しゃしん" style="width: 54px; height: 54px; flex-shrink: 0; box-sizing: border-box; border: 2.5px solid var(--color-ink); border-radius: 16px; background: var(--color-photo); display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" viewBox="10 30 220 110" width="40" height="20"><rect x="16" y="44" width="208" height="76" rx="38" fill="#3B3F52"></rect><circle cx="182" cy="82" r="24" fill="#F0444F"></circle></svg>
    </span>
    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 900; line-height: 1.4">しんごうは 1にちに なんかい あかに なる？</span>
      <span style="font-size: 13px; font-weight: 900; color: var(--color-purple-dark)">じょうほう ・ じかんと かいすう</span>
    </span>
    <span style="flex-shrink: 0; padding: 2px 8px; border: 2px solid var(--color-navi); border-radius: 10px; color: var(--color-navi-dark); font-size: 12px; font-weight: 900; transform: rotate(8deg)">大はずれ</span>
  </a>

  <nav style="margin: auto -24px -24px; height: 84px; flex-shrink: 0; box-sizing: border-box; border-top: 3px solid var(--color-ink); background: var(--color-white); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="04-home.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 58px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></span>ホーム</a>
    <a href="20-zukan.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-yellow-deep); font-size: 14px; font-weight: 900"><span style="width: 58px; height: 34px; border-radius: 17px; background: var(--color-yellow-soft); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9A6B00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"></path><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"></path></svg></span>ずかん</a>
    <a href="21-minna.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 58px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16.5 14.2c2.9.3 5 2.5 5 5.8"></path></svg></span>みんな</a>
    <a href="22-settings.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 58px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></span>せってい</a>
  </nav>
</div>
