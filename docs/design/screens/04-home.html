<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホーム｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react{animation:none}}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <!-- 主役：空と まちの絵。ナビが、今日のお題を ふきだしで言う（のこった たかさは 空が うめる） -->
  <div style="flex: 1 1 auto; min-height: 300px; box-sizing: border-box; border-radius: 32px; background: var(--color-navi-light); overflow: hidden; display: flex; flex-direction: column">
    <div style="padding: 16px 18px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px">
      <span style="font-family: var(--font-pop); font-size: 21px; line-height: 1.375">こんにちは、そら！</span>
      <span style="padding: 3px 12px; border-radius: 12px; background: var(--color-purple); color: var(--color-white); font-size: 14px; font-weight: 900">エンジニアレベル</span>
    </div>
    <!-- 今日のお題（押せないので 地の色だけ。しっぽは ナビへ向ける） -->
    <div style="position: relative; margin: 12px 14px 0; padding: 12px 16px; border-radius: 22px; background: var(--color-white); display: flex; flex-direction: column; gap: 2px">
      <div style="position: absolute; right: 58px; bottom: -8px; width: 20px; height: 20px; border-radius: 4px; background: var(--color-white); transform: rotate(45deg)"></div>
      <span style="position: relative; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 900; color: var(--color-yellow-deep)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFC83D" stroke="#22223A" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
        きょうの おだい
      </span>
      <span style="position: relative; font-family: var(--font-pop); font-size: 18px; line-height: 1.45">まるい ものを さがそう！</span>
    </div>
    <div role="img" aria-label="まちの え。いえ、き、しんごうに はてなが かくれている" style="position: relative; flex: 1 1 auto; min-height: 104px">
      <svg aria-hidden="true" width="74" viewBox="174 76 54 28" style="position: absolute; left: 7%; top: 9%"><path d="M178 100a14 14 0 0 1 26-6 12 12 0 0 1 20 6z" fill="#FFFFFF" stroke="#22223A" stroke-width="3" stroke-linejoin="round"></path></svg>
      <svg aria-hidden="true" width="54" viewBox="174 76 54 28" style="position: absolute; left: 44%; top: 27%"><path d="M178 100a14 14 0 0 1 26-6 12 12 0 0 1 20 6z" fill="#FFFFFF" stroke="#22223A" stroke-width="3" stroke-linejoin="round"></path></svg>
      <!-- まち（230px まで。ひくい画面では いっしょに ちぢむ） -->
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 230px">
        <span style="position: absolute; right: 7%; top: 8%; width: 44px; height: 44px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-yellow)"></span>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; box-sizing: border-box; border-top: 3px solid var(--color-ink); background: #9BE3C8"></div>
        <svg aria-hidden="true" width="336" height="134" viewBox="0 96 336 134" style="position: absolute; left: 0; bottom: 0"><path d="M16 140L50 110L84 140Z" fill="#FF6F9C" stroke="#22223A" stroke-width="3" stroke-linejoin="round"></path><rect x="22" y="140" width="56" height="46" fill="#FFE8F0" stroke="#22223A" stroke-width="3"></rect><rect x="42" y="158" width="16" height="28" fill="#FFC83D" stroke="#22223A" stroke-width="3"></rect><rect x="112" y="152" width="10" height="34" fill="#B08968" stroke="#22223A" stroke-width="3"></rect><circle cx="117" cy="138" r="24" fill="#24C3A0" stroke="#22223A" stroke-width="3"></circle><rect x="164" y="128" width="8" height="58" fill="#B7BCCD" stroke="#22223A" stroke-width="3"></rect><rect x="140" y="110" width="56" height="24" rx="12" fill="#3B3F52" stroke="#22223A" stroke-width="3"></rect><circle cx="154" cy="122" r="6" fill="#5B6074"></circle><circle cx="168" cy="122" r="6" fill="#5B6074"></circle><circle cx="182" cy="122" r="6" fill="#F0444F"></circle></svg>
        <!-- かくれている「？」（アプリでは ふわふわ うく） -->
        <span style="position: absolute; left: 51px; bottom: 125px; width: 27px; height: 27px; box-sizing: border-box; border: 2.5px solid var(--color-ink); border-radius: 50%; background: var(--color-white); display: flex; align-items: center; justify-content: center; font-family: var(--font-pop); font-size: 14px; line-height: 1; color: var(--color-purple)">?</span>
        <span style="position: absolute; left: 123px; bottom: 121px; width: 27px; height: 27px; box-sizing: border-box; border: 2.5px solid var(--color-ink); border-radius: 50%; background: var(--color-white); display: flex; align-items: center; justify-content: center; font-family: var(--font-pop); font-size: 14px; line-height: 1; color: var(--color-pink)">?</span>
        <img class="navi" src="../assets/navi/navi-smile.png" alt="ナビ（にこにこ）" style="position: absolute; right: 2px; bottom: 36px; width: 124px; height: 124px">
      </div>
    </div>
  </div>

  <a href="05-camera.html" style="height: 92px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 30px; background: var(--color-navi); box-shadow: 0 7px 0 var(--color-ink); color: var(--color-white); display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13.5" r="4"></circle></svg>
    <span style="font-family: var(--font-pop); font-size: 25px">はてなを さがす！</span>
  </a>

  <!-- カメラを使わない 2つの入口（上に絵、下に ことば）。見本の絵は、一覧の画面で えらぶ -->
  <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 4px">
    <a href="06-kakomu.html" style="height: 76px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-white); box-shadow: var(--shadow-pop-sm); color: var(--color-ink); font-size: 15px; font-weight: 900; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M4 17l5-5 4 4 3-3 4 4"></path></svg>
      アルバムから えらぶ
    </a>
    <a href="06-kakomu.html" style="height: 76px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-white); box-shadow: var(--shadow-pop-sm); color: var(--color-ink); font-size: 15px; font-weight: 900; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.3 0 2-.8 2-1.8 0-1.2-1-1.6-1-2.7 0-.9.8-1.5 1.8-1.5H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"></path><path d="M7.6 12.2h.01M9.8 7.9h.01M14.6 7.6h.01"></path></svg>
      みほんの えで ためす
    </a>
  </div>

  <nav aria-label="メニュー" style="margin: auto -24px -24px; padding-top: 18px; height: 102px; flex-shrink: 0; box-sizing: border-box; background: linear-gradient(var(--color-ink), var(--color-ink)) 0 18px / 100% 3px no-repeat, linear-gradient(var(--color-white), var(--color-white)) 0 18px / 100% 100% no-repeat; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="20-zukan.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"></path><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"></path></svg></span>ずかん</a>
    <a href="21-stamp.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.5" r="2.5"></circle><path d="M10.5 8v4M13.5 8v4"></path><path d="M5 16a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2H5z"></path><path d="M5 21.5h14"></path></svg></span>スタンプ</a>
    <a href="04-home.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; text-decoration: none"><span style="margin-top: -14px; width: 76px; height: 76px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-navi); box-shadow: 0 0 0 3px var(--color-white), 0 0 0 7px var(--color-yellow); color: var(--color-white); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 900"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg>ホーム</span></a>
    <a href="22-minna.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16.5 14.2c2.9.3 5 2.5 5 5.8"></path></svg></span>みんな</a>
    <a href="23-settings.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></span>せってい</a>
  </nav>
</div>

</html>
