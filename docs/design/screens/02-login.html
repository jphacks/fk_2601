<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン・はじめて｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 14px">
  <div style="position: relative; margin: -24px -24px 4px; padding: 28px 24px 22px; background: var(--color-navi-light); border-bottom: 3px solid var(--color-ink); border-radius: 0 0 44px 44px; display: flex; align-items: center; gap: 12px">
    <svg aria-hidden="true" width="390" height="190" viewBox="0 0 390 190" style="position: absolute; left: 0; top: 0"><path d="M350 30l5 10 11 2-8 7 2 11-10-6-10 6 2-11-8-7 11-2z" fill="#FFC83D" stroke="#22223A" stroke-width="2.5" stroke-linejoin="round"></path><circle cx="300" cy="150" r="7" fill="#FF6F9C" stroke="#22223A" stroke-width="2.5"></circle></svg>
    <img src="../assets/navi/navi-smile.png" alt="ナビ（にこにこ）" style="position: relative; width: 120px; height: 120px; flex-shrink: 0">
    <div style="position: relative; display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: var(--font-pop); font-weight: 400; font-size: 30px">ようこそ！</h1>
      <span style="font-size: 17px; font-weight: 900; line-height: 1.5">はてなハンターに<br>なろう！</span>
    </div>
  </div>

  <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-white)">
    <button type="button" role="tab" class="tab" data-mode="new" aria-selected="true">はじめて</button>
    <button type="button" role="tab" class="tab" data-mode="back" aria-selected="false">つづきから</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="uname" style="font-size: 19px; font-weight: 900">ログインの なまえ <span style="font-size: 15px; font-weight: 700; color: var(--color-ink-sub)">ひらがなで いいよ</span></label>
    <input id="uname" type="text" placeholder="れい：そらまめ" style="height: 60px; box-sizing: border-box; padding: 0 18px; border: 3px solid var(--color-ink); border-radius: 20px; background: var(--color-white); font-family: inherit; font-size: 20px; font-weight: 700; color: var(--color-ink)">
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="pw" style="font-size: 19px; font-weight: 900">パスワード</label>
    <input id="pw" type="password" style="height: 60px; box-sizing: border-box; padding: 0 18px; border: 3px solid var(--color-ink); border-radius: 20px; background: var(--color-white); font-family: inherit; font-size: 20px; color: var(--color-ink)">
  </div>

  <div style="display: flex; gap: 10px; padding: 12px 16px; border-radius: 20px; background: var(--color-yellow-light); color: var(--color-yellow-dark); font-size: 16px; font-weight: 900; line-height: 1.6">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6E4D00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <span>パスワードを わすれると、ずかんに もどれないよ。おうちの ひとと メモしてね</span>
  </div>

  <a href="03-profile.html" style="margin-top: auto; margin-bottom: 6px; height: 72px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-navi); box-shadow: var(--shadow-pop); color: var(--color-white); font-family: var(--font-pop); font-size: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none"><span id="cta">はじめる！</span></a>
</div>
<script src="../screen.js"></script>
<script>
group('.tab', 'aria-selected', function (tab) {
  document.getElementById('cta').textContent = tab.dataset.mode === 'new' ? 'はじめる！' : 'ログイン';
});
</script>
</body>
</html>
