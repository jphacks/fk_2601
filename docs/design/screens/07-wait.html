<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つかまえた！（待ち・クイズ）｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 14px">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; z-index: -1; pointer-events: none"><circle cx="30" cy="20" r="7" fill="#FFC83D"></circle><path d="M360 18l14 5-11 10z" fill="#FF6F9C"></path><rect x="196" y="12" width="12" height="12" rx="2" fill="#24C3A0" transform="rotate(25 202 18)"></rect><path d="M336 150q8-10 16 0t16 0" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"></path><circle cx="16" cy="170" r="6" fill="#4A5AE8"></circle><path d="M372 92l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#FFC83D"></path></svg>

  <div style="display: flex; align-items: center; gap: 14px; margin-top: 6px">
    <div role="img" aria-label="つかまえた ところ" style="position: relative; width: 128px; height: 128px; flex-shrink: 0">
      <svg aria-hidden="true" width="128" height="128" viewBox="0 0 128 128" style="position: absolute; left: 0; top: 0"><circle cx="64" cy="64" r="58" fill="#EAF0F8" stroke="#FFC83D" stroke-width="10"></circle><circle cx="64" cy="64" r="58" fill="none" stroke="#4A5AE8" stroke-width="4"></circle><rect x="18" y="48" width="92" height="34" rx="17" fill="#3B3F52"></rect><circle cx="38" cy="65" r="10" fill="#5B6074"></circle><circle cx="64" cy="65" r="10" fill="#5B6074"></circle><circle cx="90" cy="65" r="10" fill="#F0444F"></circle></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: var(--font-pop); font-size: 32px; color: var(--color-pink); -webkit-text-stroke: 1.5px var(--color-ink)">つかまえた！</span>
      <span style="align-self: flex-start; padding: 4px 12px; border: 2.5px solid var(--color-ink); border-radius: 14px; background: var(--color-yellow-light); font-size: 15px; font-weight: 900">いま しらべてるよ</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px">
    <img src="../assets/navi/navi-effort.png" alt="ナビ（しらべ中）" style="width: 76px; height: 76px; flex-shrink: 0">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
      <div role="progressbar" aria-label="しらべている ところ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="45" style="height: 24px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 12px; background: var(--color-white); overflow: hidden">
        <div style="width: 45%; height: 100%; background: var(--color-navi); border-right: 3px solid var(--color-ink)"></div>
      </div>
      <span style="font-size: 15px; font-weight: 900; color: var(--color-ink-sub)">1ぷんくらい かかる ことも あるよ</span>
    </div>
  </div>

  <div style="padding: 16px 18px 18px; border: 3px solid var(--color-ink); border-radius: 28px; background: var(--color-yellow-light); box-shadow: var(--shadow-pop-md); display: flex; flex-direction: column; gap: 12px">
    <span style="display: flex; align-items: center; gap: 6px; font-family: var(--font-pop); font-size: 17px; color: var(--color-yellow-dark)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#6E4D00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg>
      まめちしき クイズ
    </span>
    <div class="if" data-if="q0">
      <span style="font-size: 23px; font-weight: 900; line-height: 1.75">1<ruby>円<rt>えん</rt></ruby><ruby>玉<rt>だま</rt></ruby>の <ruby>重<rt>おも</rt></ruby>さは<br>ちょうど 1グラム。</span>
    </div>
    <div class="if" data-if="q1" hidden>
      <span style="font-size: 23px; font-weight: 900; line-height: 1.75">タコの しんぞうは<br>1つ だけ。</span>
    </div>
    <div class="if" data-if="q2" hidden>
      <span style="font-size: 23px; font-weight: 900; line-height: 1.75">1<ruby>円<rt>えん</rt></ruby><ruby>玉<rt>だま</rt></ruby>の はばは<br>ちょうど 2センチ。</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button type="button" data-on="pickO" aria-label="まる" style="height: 84px; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-white); box-shadow: var(--shadow-pop-md); cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#F0444F" stroke-width="3.4" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle></svg>
      </button>
      <button type="button" data-on="pickX" aria-label="ばつ" style="height: 84px; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-white); box-shadow: var(--shadow-pop-md); cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#4A5AE8" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg>
      </button>
    </div>
    <div class="if" data-if="answered" hidden>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <span style="font-family: var(--font-pop); font-size: 18px; color: var(--color-ink)"><span id="quiz-result"></span></span>
        <button type="button" data-on="next" style="height: 44px; padding: 0 14px; border: 2.5px solid var(--color-ink); border-radius: 18px; background: var(--color-white); font-family: inherit; font-size: 15px; font-weight: 900; color: var(--color-ink); cursor: pointer">つぎの クイズ</button>
      </div>
    </div>
  </div>

  <div class="if" data-if="done" hidden>
    <a href="08-check.html" style="margin-top: auto; margin-bottom: 6px; height: 72px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-navi); box-shadow: var(--shadow-pop); color: var(--color-white); font-family: var(--font-pop); font-size: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none">できた！ みてみる</a>
  </div>
</div>
<script src="../screen.js"></script>
<script>
// まめちしき○×クイズ。こたえ：1問目○、2問目×、3問目○
var answers = ['o', 'x', 'o'];
var current = 0;
var questions = document.querySelectorAll('[data-if^="q"]');
var answered = document.querySelector('[data-if="answered"]');
var result = document.getElementById('quiz-result');
function pick(choice) {
  var mark = answers[current] === 'o' ? '○' : '×';
  result.textContent = choice === answers[current] ? 'せいかい！ ' + mark + ' だよ' : 'おしい！ こたえは ' + mark;
  answered.hidden = false;
}
on('pickO', function () { pick('o'); });
on('pickX', function () { pick('x'); });
on('next', function () {
  current = (current + 1) % questions.length;
  questions.forEach(function (q, i) { q.hidden = i !== current; });
  answered.hidden = true;
});
// 問いができたら（見本では5秒後）「できた！みてみる」を出す
setTimeout(function () { document.querySelector('[data-if="done"]').hidden = false; }, 5000);
</script>
</body>
</html>
