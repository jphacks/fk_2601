<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>なぞとき（解説）｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">

</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 10px; height: 52px">
    <a href="16-hazure.html" aria-label="もどる" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-white); box-shadow: var(--shadow-pop-xs); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--font-pop); font-weight: 400; font-size: 24px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFC83D" stroke="#22223A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg>
      なぞとき
    </h1>
  </div>

  <div style="display: flex; align-items: center; gap: 12px">
    <img src="../assets/navi/navi-smile.png" alt="ナビ（にこにこ）" style="width: 88px; height: 88px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 10px 16px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-white); box-shadow: var(--shadow-pop-sm); font-size: 21px; font-weight: 900; line-height: 1.75">
      <div style="position: absolute; left: -11px; top: calc(50% - 9px); width: 16px; height: 16px; background: var(--color-white); border-left: 3px solid var(--color-ink); border-bottom: 3px solid var(--color-ink); transform: rotate(45deg)"></div>
      2<ruby>分<rt>ふん</rt></ruby>ごとに、<br>1<ruby>日<rt>にち</rt></ruby>じゅう <ruby>赤<rt>あか</rt></ruby>に なるから！
    </div>
  </div>

  <button type="button" id="toggle" aria-expanded="true" style="height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-white); box-shadow: var(--shadow-pop-sm); color: var(--color-ink); font-family: var(--font-pop); font-size: 18px; cursor: pointer">
    くわしく みる
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" id="chev" style="transform: rotate(180deg)"><path d="M6 9l6 6 6-6"></path></svg>
  </button>

  <div class="if" data-if="open">
    <ol style="list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
      <li style="display: flex; gap: 12px; padding: 12px 14px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-navi-light)">
        <span style="width: 42px; height: 42px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-navi); color: var(--color-white); font-family: var(--font-pop); font-size: 20px; display: flex; align-items: center; justify-content: center">1</span>
        <div style="display: flex; flex-direction: column">
          <span style="font-size: 21px; font-weight: 900; line-height: 1.7">1<ruby>日<rt>にち</rt></ruby>は 24<ruby>時間<rt>じかん</rt></ruby></span>
          <span style="font-family: var(--font-pop); font-size: 22px; color: var(--color-navi-dark); line-height: 1.7">24×60 ＝ 1440<ruby>分<rt>ぷん</rt></ruby></span>
        </div>
      </li>
      <li style="display: flex; gap: 12px; padding: 12px 14px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-yellow-light)">
        <span style="width: 42px; height: 42px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-yellow); font-family: var(--font-pop); font-size: 20px; display: flex; align-items: center; justify-content: center">2</span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 21px; font-weight: 900; line-height: 1.7">2<ruby>分<rt>ふん</rt></ruby>で ひとまわり</span>
          <div role="img" aria-label="2ふんの あいだに あお、きいろ、あかが 1かいずつ" style="display: flex; height: 26px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 13px; overflow: hidden">
            <span style="width: 55%; background: var(--color-mint); border-right: 3px solid var(--color-ink)"></span>
            <span style="width: 8%; background: var(--color-yellow); border-right: 3px solid var(--color-ink)"></span>
            <span style="width: 37%; background: var(--color-red)"></span>
          </div>
        </div>
      </li>
      <li style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-pink-light); box-shadow: var(--shadow-pop-sm)">
        <span style="width: 42px; height: 42px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-pink); font-family: var(--font-pop); font-size: 20px; display: flex; align-items: center; justify-content: center">3</span>
        <span style="font-family: var(--font-pop); font-size: 24px; line-height: 1.7">1440÷2 ＝ 720<ruby>回<rt>かい</rt></ruby></span>
      </li>
    </ol>
  </div>

  <span style="display: flex; gap: 8px; font-size: 15px; font-weight: 900; color: var(--color-ink-sub); line-height: 1.6">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4E6A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11" x2="12" y2="16"></line><circle cx="12" cy="7.8" r="0.6" fill="#4A4E6A"></circle></svg>
    ひとまわりの じかんは ばしょで ちがうよ。ここでは 2ふんで けいさんしたよ
  </span>

  <div style="display: flex; gap: 10px; margin-top: auto; margin-bottom: 6px">
    <a href="19-get.html" style="flex: 1 1 0; height: 68px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-white); box-shadow: var(--shadow-pop-md); color: var(--color-ink); font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; text-decoration: none">ずかんに のこす</a>
    <a href="18-moshimo.html" style="flex: 1 1 0; height: 68px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-pink); box-shadow: var(--shadow-pop-md); color: var(--color-ink); font-family: var(--font-pop); font-size: 21px; display: flex; align-items: center; justify-content: center; text-decoration: none">もしも…？</a>
  </div>
</div>
<script src="../screen.js"></script>
<script>
var toggle = document.getElementById('toggle');
var chev = document.getElementById('chev');
var steps = document.querySelector('[data-if="open"]');
toggle.addEventListener('click', function () {
  var open = steps.hidden;
  steps.hidden = !open;
  toggle.setAttribute('aria-expanded', String(open));
  chev.style.transform = open ? 'rotate(180deg)' : '';
});
</script>
</body>
</html>
