<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>② パスワード｜はじめまして 見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../screen.css">
<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.sheet{animation:sheet-up .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes sheet-up{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react,.sheet{animation:none}}
.off{opacity:.4;pointer-events:none}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px; height: 52px">
    <a href="02-login-id.html" aria-label="もどる" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-white); box-shadow: var(--shadow-pop-xs); display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div role="progressbar" aria-label="とうろく" aria-valuemin="0" aria-valuemax="4" aria-valuenow="2" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><span style="height: 12px; border-radius: 6px; background: var(--color-navi)"></span><span style="height: 12px; border-radius: 6px; background: var(--color-navi)"></span><span style="height: 12px; border-radius: 6px; background: var(--color-navi-light)"></span><span style="height: 12px; border-radius: 6px; background: var(--color-navi-light)"></span></div>
    <span style="font-family: var(--font-pop); font-size: 17px; color: var(--color-navi-dark)">2/4</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px">
    <img class="navi-react" src="../../assets/navi/navi-effort.png" alt="ナビ（ぎゅっ）" style="width: 112px; height: 112px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 14px 18px; border-radius: 24px; background: var(--color-navi-light); font-family: var(--font-pop); font-size: 24px; line-height: 1.55">
      <div style="position: absolute; left: -8px; top: calc(50% - 8px); width: 16px; height: 16px; background: var(--color-navi-light); transform: rotate(45deg)"></div>
      パスワードを<br>きめてね
    </div>
  </div>

  <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px">
    <label for="pw" style="font-family: var(--font-pop); font-size: 19px">パスワード</label>
    <div style="display: flex; gap: 8px">
      <input id="pw" type="password" class="pw" autocomplete="new-password" value="hatena7" data-pw="1" style="width: 100%; height: 64px; box-sizing: border-box; padding: 0 18px; border: 3px solid var(--color-ink); border-radius: 20px; background: var(--color-white); font-family: inherit; font-size: 22px; font-weight: 700; color: var(--color-ink)">
      <button type="button" data-on="toggle" style="height: 64px; flex-shrink: 0; padding: 0 14px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 20px; background: var(--color-white); box-shadow: var(--shadow-pop-xs); font-family: inherit; font-size: 16px; font-weight: 900; color: var(--color-ink); cursor: pointer">みる</button>
    </div>
    <span id="len" style="font-size: 15px; font-weight: 900; color: var(--color-mint-dark)">✓ 6もじ いじょう、OK！</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="pw2" style="font-family: var(--font-pop); font-size: 19px">もういちど</label>
    <input id="pw2" type="password" class="pw" autocomplete="new-password" value="hatena7" data-pw="2" style="width: 100%; height: 64px; box-sizing: border-box; padding: 0 18px; border: 3px solid var(--color-ink); border-radius: 20px; background: var(--color-white); font-family: inherit; font-size: 22px; font-weight: 700; color: var(--color-ink)">
    <span id="match" style="font-size: 15px; font-weight: 900; color: var(--color-mint-dark)">✓ おなじだよ！</span>
  </div>
  <div style="display: flex; gap: 10px; padding: 12px 16px; border-radius: 20px; background: var(--color-yellow-light); color: var(--color-yellow-dark); font-size: 16px; font-weight: 900; line-height: 1.6">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6E4D00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <span>ID と パスワードを わすれると、ずかんに もどれないよ。おうちの ひとと メモしてね</span>
  </div>

  <a href="04-nickname.html" data-cta style="margin-top: auto; margin-bottom: 6px; height: 72px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-navi); box-shadow: var(--shadow-pop); color: var(--color-white); font-family: var(--font-pop); font-size: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none">ID を つくる！</a>
</div>
<script src="../../screen.js"></script>
<script>
// パスワードを みる／かくす
on('toggle', function (e) {
  var show = e.currentTarget.textContent === 'みる';
  document.querySelectorAll('.pw').forEach(function (i) { i.type = show ? 'text' : 'password'; });
  e.currentTarget.textContent = show ? 'かくす' : 'みる';
});
// 6もじ いじょうか、2かいめが おなじかを その ばで しらせる（パスワードを わすれると もどれないため）
var p1 = document.querySelector('[data-pw="1"]'), p2 = document.querySelector('[data-pw="2"]');
var len = document.getElementById('len'), match = document.getElementById('match'), cta = document.querySelector('[data-cta]');
var OK = 'var(--color-mint-dark)', NG = 'var(--color-pink-dark)', SUB = 'var(--color-ink-sub)';
function check() {
  var lenOk = p1.value.length >= 6, same = p2.value.length > 0 && p1.value === p2.value, differ = p2.value.length > 0 && !same;
  len.textContent = lenOk ? '✓ 6もじ いじょう、OK！' : '6もじ いじょうに してね';
  len.style.color = lenOk ? OK : SUB;
  match.textContent = same ? '✓ おなじだよ！' : differ ? '1かいめと ちがうよ。もういちど いれてね' : 'おなじ パスワードを もういちど いれてね';
  match.style.color = same ? OK : differ ? NG : SUB;
  cta.classList.toggle('off', !(lenOk && same));
}
p1.addEventListener('input', check); p2.addEventListener('input', check);
</script>
</body>
</html>
