<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おかえり（つづきから）｜はじめまして 見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../screen.css">
<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.sheet{animation:sheet-up .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes sheet-up{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react,.sheet{animation:none}}
.off{opacity:.4;pointer-events:none}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; height: 52px"><a href="01-welcome.html" aria-label="もどる" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-white); box-shadow: var(--shadow-pop-xs); display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></div>

  <div style="position: relative; padding: 18px 20px; border-radius: 32px; background: var(--color-navi-light); display: flex; align-items: center; justify-content: center; gap: 12px; overflow: hidden">
    <img class="navi-react" src="../../assets/navi/navi-think.png" alt="ナビ（はてな）" style="width: 108px; height: 108px; flex-shrink: 0">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: var(--font-pop); font-weight: 400; font-size: 30px">おかえり！</h1>
      <span style="font-size: 17px; font-weight: 900; line-height: 1.5">まえに きめた ID で<br>ログインしてね</span>
    </div>
  </div>

  <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px">
    <label for="uid" style="font-family: var(--font-pop); font-size: 19px">ログイン ID</label>
    <input id="uid" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="まえに きめた ID" value="sora2026" data-need="id" style="width: 100%; height: 64px; box-sizing: border-box; padding: 0 18px; border: 3px solid var(--color-ink); border-radius: 20px; background: var(--color-white); font-family: inherit; font-size: 22px; font-weight: 700; color: var(--color-ink)">
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="pw" style="font-family: var(--font-pop); font-size: 19px">パスワード</label>
    <div style="display: flex; gap: 8px">
      <input id="pw" type="password" class="pw" autocomplete="current-password" value="hatena7" data-need="pw" style="width: 100%; height: 64px; box-sizing: border-box; padding: 0 18px; border: 3px solid var(--color-ink); border-radius: 20px; background: var(--color-white); font-family: inherit; font-size: 22px; font-weight: 700; color: var(--color-ink)">
      <button type="button" data-on="toggle" style="height: 64px; flex-shrink: 0; padding: 0 14px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 20px; background: var(--color-white); box-shadow: var(--shadow-pop-xs); font-family: inherit; font-size: 16px; font-weight: 900; color: var(--color-ink); cursor: pointer">みる</button>
    </div>
  </div>
  <div style="display: flex; gap: 10px; padding: 12px 16px; border-radius: 20px; background: var(--color-yellow-light); color: var(--color-yellow-dark); font-size: 16px; font-weight: 900; line-height: 1.6">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6E4D00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <span>わすれちゃったら、おうちの ひとと かいた メモを みてね</span>
  </div>

  <a href="../../screens/04-home.html" data-cta style="margin-top: auto; margin-bottom: 6px; height: 72px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-navi); box-shadow: var(--shadow-pop); color: var(--color-white); font-family: var(--font-pop); font-size: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none">ログイン</a>
</div>
<script src="../../screen.js"></script>
<script>
// 入れおわるまで「つぎへ」は おせない（うすくする。アプリの Button の disabled と おなじ）
var cta = document.querySelector('[data-cta]');
var needs = Array.prototype.slice.call(document.querySelectorAll('[data-need]'));
function check() { cta.classList.toggle('off', !needs.every(function (i) { return i.value.trim().length > 0; })); }
needs.forEach(function (i) { i.addEventListener('input', check); });
// パスワードを みる／かくす
on('toggle', function (e) {
  var show = e.currentTarget.textContent === 'みる';
  document.querySelectorAll('.pw').forEach(function (i) { i.type = show ? 'text' : 'password'; });
  e.currentTarget.textContent = show ? 'かくす' : 'みる';
});
</script>
</body>
</html>
