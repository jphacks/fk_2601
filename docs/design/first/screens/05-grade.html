<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>④ 学年｜はじめまして 見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../screen.css">
<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.sheet{animation:sheet-up .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes sheet-up{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react,.sheet{animation:none}}
.off{opacity:.4;pointer-events:none}
.fgrade{height:96px;box-sizing:border-box;border:3px solid var(--color-ink);border-radius:24px;color:var(--color-ink);font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;box-shadow:0 4px 0 var(--color-ink)}
.fgrade-n{font-family:var(--font-pop);font-size:34px;line-height:1.1}
.fgrade-l{font-size:14px;font-weight:900}
.fgrade[aria-checked="true"]{box-shadow:none;transform:translateY(4px)}
.fgrade[data-c="1"]{background:var(--color-pink-light)}.fgrade[data-c="2"]{background:var(--color-orange-light)}.fgrade[data-c="3"]{background:var(--color-yellow-light)}
.fgrade[data-c="4"]{background:var(--color-mint-light)}.fgrade[data-c="5"]{background:var(--color-navi-light)}.fgrade[data-c="6"]{background:var(--color-purple-light)}
.fgrade[data-c="1"][aria-checked="true"]{background:var(--color-pink)}.fgrade[data-c="2"][aria-checked="true"]{background:var(--color-orange)}
.fgrade[data-c="3"][aria-checked="true"]{background:var(--color-yellow)}.fgrade[data-c="4"][aria-checked="true"]{background:var(--color-mint)}
.fgrade[data-c="5"][aria-checked="true"]{background:var(--color-navi);color:var(--color-white)}.fgrade[data-c="6"][aria-checked="true"]{background:var(--color-purple);color:var(--color-white)}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px; height: 52px">
    <a href="04-nickname.html" aria-label="もどる" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-white); box-shadow: var(--shadow-pop-xs); display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div role="progressbar" aria-label="とうろく" aria-valuemin="0" aria-valuemax="4" aria-valuenow="4" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><span style="height: 12px; border-radius: 6px; background: var(--color-navi)"></span><span style="height: 12px; border-radius: 6px; background: var(--color-navi)"></span><span style="height: 12px; border-radius: 6px; background: var(--color-navi)"></span><span style="height: 12px; border-radius: 6px; background: var(--color-navi)"></span></div>
    <span style="font-family: var(--font-pop); font-size: 17px; color: var(--color-navi-dark)">4/4</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px">
    <img class="navi-react" src="../../assets/navi/navi-think.png" alt="ナビ（はてな）" style="width: 112px; height: 112px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 14px 18px; border-radius: 24px; background: var(--color-navi-light); font-family: var(--font-pop); font-size: 24px; line-height: 1.55">
      <div style="position: absolute; left: -8px; top: calc(50% - 8px); width: 16px; height: 16px; background: var(--color-navi-light); transform: rotate(45deg)"></div>
      <ruby>学年<rt>がくねん</rt></ruby>を<br>おしえてね
    </div>
  </div>

  <div role="radiogroup" aria-label="がくねん" style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <button type="button" role="radio" class="fgrade" data-c="1" aria-checked="false" aria-label="1ねんせい"><span class="fgrade-n">1</span><span class="fgrade-l">ねんせい</span></button>
      <button type="button" role="radio" class="fgrade" data-c="2" aria-checked="false" aria-label="2ねんせい"><span class="fgrade-n">2</span><span class="fgrade-l">ねんせい</span></button>
      <button type="button" role="radio" class="fgrade" data-c="3" aria-checked="false" aria-label="3ねんせい"><span class="fgrade-n">3</span><span class="fgrade-l">ねんせい</span></button>
      <button type="button" role="radio" class="fgrade" data-c="4" aria-checked="false" aria-label="4ねんせい"><span class="fgrade-n">4</span><span class="fgrade-l">ねんせい</span></button>
      <button type="button" role="radio" class="fgrade" data-c="5" aria-checked="true" aria-label="5ねんせい"><span class="fgrade-n">5</span><span class="fgrade-l">ねんせい</span></button>
      <button type="button" role="radio" class="fgrade" data-c="6" aria-checked="false" aria-label="6ねんせい"><span class="fgrade-n">6</span><span class="fgrade-l">ねんせい</span></button>
  </div>
  <ul style="list-style: none; margin: 0; padding: 12px 16px; border-radius: 20px; background: var(--color-cloud); color: var(--color-ink-sub); display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 900; line-height: 1.6"><li style="display: flex; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4E6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>がくねんに あわせて、はてなの むずかしさが かわるよ</span></li><li style="display: flex; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4E6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>がくねんが あがったら、せっていで かえられるよ</span></li></ul>

  <a href="06-ready.html" style="margin-top: auto; margin-bottom: 6px; height: 72px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-navi); box-shadow: var(--shadow-pop); color: var(--color-white); font-family: var(--font-pop); font-size: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none">けってい！</a>
</div>
<script src="../../screen.js"></script>
<script>
// 学年は 1つだけ えらべる（えらんだら 押しこまれた形）
group('.fgrade', 'aria-checked');
</script>
</body>
</html>
