<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>① ログイン ID（つかわれていたとき）｜はじめまして 見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../screen.css">
<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.sheet{animation:sheet-up .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes sheet-up{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react,.sheet{animation:none}}
.off{opacity:.4;pointer-events:none}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px; height: 52px">
    <a href="01-welcome.html" aria-label="もどる" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-white); box-shadow: var(--shadow-pop-xs); display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div role="progressbar" aria-label="とうろく" aria-valuemin="0" aria-valuemax="4" aria-valuenow="1" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><span style="height: 12px; border-radius: 6px; background: var(--color-navi)"></span><span style="height: 12px; border-radius: 6px; background: var(--color-navi-light)"></span><span style="height: 12px; border-radius: 6px; background: var(--color-navi-light)"></span><span style="height: 12px; border-radius: 6px; background: var(--color-navi-light)"></span></div>
    <span style="font-family: var(--font-pop); font-size: 17px; color: var(--color-navi-dark)">1/4</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px">
    <img class="navi-react" src="../../assets/navi/navi-blank.png" alt="ナビ（ぽかん）" style="width: 112px; height: 112px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 14px 18px; border-radius: 24px; background: var(--color-navi-light); font-family: var(--font-pop); font-size: 24px; line-height: 1.55">
      <div style="position: absolute; left: -8px; top: calc(50% - 8px); width: 16px; height: 16px; background: var(--color-navi-light); transform: rotate(45deg)"></div>
      その ID は<br>つかわれてるよ
    </div>
  </div>

  <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px">
    <label for="uid" style="font-family: var(--font-pop); font-size: 19px">ログイン ID</label>
    <input id="uid" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" value="sora" data-taken="sora" style="width: 100%; height: 64px; box-sizing: border-box; padding: 0 18px; border: 3px solid var(--color-ink); border-radius: 20px; background: var(--color-white); font-family: inherit; font-size: 22px; font-weight: 700; color: var(--color-ink)">
  </div>
  <div role="alert" style="padding: 12px 16px; border-radius: 20px; background: var(--color-pink-light); color: var(--color-pink-dark); font-size: 16px; font-weight: 900; line-height: 1.6">ほかの ひとが つかっているよ。ちがう ID に してね。すうじを たすと かぶりにくいよ（れい：sora2026）</div>
  <ul style="list-style: none; margin: 0; padding: 12px 16px; border-radius: 20px; background: var(--color-mint-light); color: var(--color-mint-dark); display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 900; line-height: 1.6"><li style="display: flex; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F7A63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>パスワードは さっき きめたまま だよ</span></li></ul>

  <a href="04-nickname.html" data-cta class="off" style="margin-top: auto; margin-bottom: 6px; height: 72px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-navi); box-shadow: var(--shadow-pop); color: var(--color-white); font-family: var(--font-pop); font-size: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none">この ID で つくる！</a>
</div>
<script src="../../screen.js"></script>
<script>
// つかわれていた ID の ままでは おせない
var id = document.querySelector('[data-taken]'), cta = document.querySelector('[data-cta]');
id.addEventListener('input', function () { var v = id.value.trim(); cta.classList.toggle('off', v.length === 0 || v === id.dataset.taken); });
</script>
</body>
</html>
