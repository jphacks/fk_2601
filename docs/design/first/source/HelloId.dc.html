<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>① ログイン ID</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22223A}a:hover{color:#22223A}
rt{font-family:'Zen Maru Gothic',sans-serif;font-size:0.5em;font-weight:900;letter-spacing:0}
input::placeholder{color:#8A8FA6}
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.sheet{animation:sheet-up .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes sheet-up{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react,.sheet{animation:none}}
</style>
</helmet>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; color: #22223A; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px; height: 52px">
    <a href="HelloWelcome.dc.html" aria-label="もどる" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 3px solid #22223A; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 0 #22223A; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div role="progressbar" aria-label="とうろく" aria-valuemin="0" aria-valuemax="4" aria-valuenow="1" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><span style="height: 12px; border-radius: 6px; background: #4A5AE8"></span><span style="height: 12px; border-radius: 6px; background: #E8EBFF"></span><span style="height: 12px; border-radius: 6px; background: #E8EBFF"></span><span style="height: 12px; border-radius: 6px; background: #E8EBFF"></span></div>
    <span style="font-family: 'Mochiy Pop One', sans-serif; font-size: 17px; color: #2F3CB8">1/4</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px">
    <img class="navi-react" src="/_blob/814e19e7f3b49ded4c95984ded149bf4" alt="ナビ（はてな）" style="width: 112px; height: 112px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 14px 18px; border-radius: 24px; background: #E8EBFF; font-family: 'Mochiy Pop One', sans-serif; font-size: 24px; line-height: 1.55">
      <div style="position: absolute; left: -8px; top: calc(50% - 8px); width: 16px; height: 16px; background: #E8EBFF; transform: rotate(45deg)"></div>
      ログイン ID を<br>きめてね
    </div>
  </div>

  <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px">
    <label for="uid" style="font-family: 'Mochiy Pop One', sans-serif; font-size: 19px">ログイン ID</label>
    <input id="uid" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="れい：sora2026" value="{{id}}" onChange="{{onId}}" style="width: 100%; height: 64px; box-sizing: border-box; padding: 0 18px; border: 3px solid #22223A; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-size: 22px; font-weight: 700; color: #22223A">
  </div>
  <ul style="list-style: none; margin: 0; padding: 12px 16px; border-radius: 20px; background: #F1F2F7; color: #4A4E6A; display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 900; line-height: 1.6"><li style="display: flex; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4E6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>ログインに つかう、きみだけの なまえ</span></li><li style="display: flex; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4E6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>えいご・すうじ・ひらがな・カタカナが つかえるよ（ひらがなは 10もじまで）</span></li></ul>
  <span style="align-self: flex-start; padding: 6px 12px; border-radius: 14px; background: #FFF6D6; color: #6E4D00; font-size: 15px; font-weight: 900; line-height: 1.5">ニックネーム（よばれる なまえ）は あとで きめるよ</span>

  <a href="HelloPassword.dc.html" style="{{cta}}">つぎへ</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { id: 'sora2026' };
  }
  renderVals() {
    const CTA = "margin-top: auto; margin-bottom: 6px; height: 72px; flex-shrink: 0; box-sizing: border-box; border: 3px solid #22223A; border-radius: 26px; background: #4A5AE8; box-shadow: 0 6px 0 #22223A; color: #FFFFFF; font-family: 'Mochiy Pop One', sans-serif; font-size: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none";
const ctaOf = (ok) => CTA + (ok ? '' : '; opacity: 0.4; pointer-events: none');
    return {
      id: this.state.id,
      onId: (e) => this.setState({ id: e.target.value }),
      cta: ctaOf(this.state.id.trim().length > 0)
    };
  }
}
</script>
</body>
</html>
