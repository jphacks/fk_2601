<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>④ 学年</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22223A}a:hover{color:#22223A}
rt{font-family:'Zen Maru Gothic',sans-serif;font-size:0.5em;font-weight:900;letter-spacing:0}
input::placeholder{color:#8A8FA6}
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.sheet{animation:sheet-up .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes sheet-up{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react,.sheet{animation:none}}
</style>
</helmet>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; color: #22223A; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px; height: 52px">
    <a href="HelloNickname.dc.html" aria-label="もどる" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 3px solid #22223A; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 0 #22223A; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div role="progressbar" aria-label="とうろく" aria-valuemin="0" aria-valuemax="4" aria-valuenow="4" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><span style="height: 12px; border-radius: 6px; background: #4A5AE8"></span><span style="height: 12px; border-radius: 6px; background: #4A5AE8"></span><span style="height: 12px; border-radius: 6px; background: #4A5AE8"></span><span style="height: 12px; border-radius: 6px; background: #4A5AE8"></span></div>
    <span style="font-family: 'Mochiy Pop One', sans-serif; font-size: 17px; color: #2F3CB8">4/4</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px">
    <img class="navi-react" src="/_blob/814e19e7f3b49ded4c95984ded149bf4" alt="ナビ（はてな）" style="width: 112px; height: 112px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 14px 18px; border-radius: 24px; background: #E8EBFF; font-family: 'Mochiy Pop One', sans-serif; font-size: 24px; line-height: 1.55">
      <div style="position: absolute; left: -8px; top: calc(50% - 8px); width: 16px; height: 16px; background: #E8EBFF; transform: rotate(45deg)"></div>
      <ruby>学年<rt>がくねん</rt></ruby>を<br>おしえてね
    </div>
  </div>

  <div role="radiogroup" aria-label="がくねん" style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{grades}}" as="g" hint-placeholder-count="6">
      <button type="button" role="radio" onClick="{{g.pick}}" aria-checked="{{g.pressed}}" aria-label="{{g.aria}}" style="{{g.style}}">
        <span style="font-family: 'Mochiy Pop One', sans-serif; font-size: 34px; line-height: 1.1">{{g.n}}</span>
        <span style="font-size: 14px; font-weight: 900">ねんせい</span>
      </button>
    </sc-for>
  </div>
  <ul style="list-style: none; margin: 0; padding: 12px 16px; border-radius: 20px; background: #F1F2F7; color: #4A4E6A; display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 900; line-height: 1.6"><li style="display: flex; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4E6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>がくねんに あわせて、はてなの むずかしさが かわるよ</span></li><li style="display: flex; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4E6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>がくねんが あがったら、せっていで かえられるよ</span></li></ul>

  <a href="HelloReady.dc.html" style="{{cta}}">けってい！</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { grade: 5 };
  }
  renderVals() {
    const CTA = "margin-top: auto; margin-bottom: 6px; height: 72px; flex-shrink: 0; box-sizing: border-box; border: 3px solid #22223A; border-radius: 26px; background: #4A5AE8; box-shadow: 0 6px 0 #22223A; color: #FFFFFF; font-family: 'Mochiy Pop One', sans-serif; font-size: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none";
const ctaOf = (ok) => CTA + (ok ? '' : '; opacity: 0.4; pointer-events: none');
    const solid = ['#FF6F9C', '#FF8A3D', '#FFC83D', '#24C3A0', '#4A5AE8', '#8B5CF6'];
    const light = ['#FFE8F0', '#FFEEDF', '#FFF6D6', '#DDF7F0', '#E8EBFF', '#F0E9FF'];
    const whiteText = [false, false, false, false, true, true];
    // 選ぶ前も 影つき。選んだら 色がつき、押しこまれた形（影なし・すこし下がる）
    const base = 'height: 96px; box-sizing: border-box; border-radius: 24px; border: 3px solid #22223A; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 0; ';
    const grades = [1, 2, 3, 4, 5, 6].map((n, i) => {
      const on = this.state.grade === n;
      return {
        n: String(n),
        aria: n + 'ねんせい',
        pressed: on ? 'true' : 'false',
        style: on
          ? base + 'background: ' + solid[i] + '; color: ' + (whiteText[i] ? '#FFFFFF' : '#22223A') + '; transform: translateY(4px)'
          : base + 'background: ' + light[i] + '; color: #22223A; box-shadow: 0 4px 0 #22223A',
        pick: () => this.setState({ grade: n })
      };
    });
    return { grades: grades, cta: ctaOf(this.state.grade !== null) };
  }
}
</script>
</body>
</html>
