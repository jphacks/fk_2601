<helmet>

<style>
body{margin:0}
a{color:#22223A}a:hover{color:#22223A}
rt{font-family:'Zen Maru Gothic',sans-serif;font-size:0.5em;font-weight:900;letter-spacing:0}
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react{animation:none}}
</style>

      <sc-for list="{{grades}}" as="g" hint-placeholder-count="6">
        <button type="button" onClick="{{g.pick}}" aria-pressed="{{g.pressed}}" aria-label="{{g.aria}}" style="{{g.style}}">{{g.n}}</button>

  </div>

  <fieldset style="margin: auto 0 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">

    <button type="button" onClick="{{pick3}}" aria-pressed="{{p3}}" style="{{s3}}">
      <span style="{{d3}}"></span>
      「3つから えらぶ」を さきに
    </button>
    <button type="button" onClick="{{pickW}}" aria-pressed="{{pW}}" style="{{sW}}">
      <span style="{{dW}}"></span>

  <a href="PopStamp.dc.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; height: 62px; padding: 0 16px; box-sizing: border-box; border: 3px solid #22223A; border-radius: 22px; background: #FFFFFF; box-shadow: 0 4px 0 #22223A; text-decoration: none; color: #22223A">

    <span style="font-size: 17px; font-weight: 900">しょうごう</span>
    <span style="margin-left: auto; padding: 2px 10px; border: 2px solid #22223A; border-radius: 12px; background: #8B5CF6; color: #FFFFFF; font-size: 14px; font-weight: 900">エンジニアレベル</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
  </a>

  <a href="GuideFlow.dc.html" style="display: flex; align-items: center; gap: 10px; height: 62px; padding: 0 16px; box-sizing: border-box; border: 3px solid #22223A; border-radius: 22px; background: #FFFFFF; box-shadow: 0 4px 0 #22223A; text-decoration: none; color: #22223A">
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#4A5AE8" stroke="#22223A" stroke-width="1.8"></circle><path d="M9.3 9.4a2.8 2.8 0 0 1 5.4 1c0 1.8-2.7 2.3-2.7 3.9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path><circle cx="12" cy="17.3" r="1.3" fill="#FFFFFF"></circle></svg>
    <span style="font-size: 17px; font-weight: 900">あそびかたを もういちど みる</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: auto"><path d="M9 5l7 7-7 7"></path></svg>
  </a>

  <a href="HelloWelcome.dc.html" style="height: 56px; box-sizing: border-box; border: 3px solid #22223A; border-radius: 22px; background: #FFE8F0; box-shadow: 0 4px 0 #22223A; color: #A12A55; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; text-decoration: none">ログアウト</a>

  <nav aria-label="メニュー" style="margin: auto -24px -24px; padding-top: 18px; height: 102px; flex-shrink: 0; box-sizing: border-box; background: linear-gradient(#22223A, #22223A) 0 18px / 100% 3px no-repeat, linear-gradient(#FFFFFF, #FFFFFF) 0 18px / 100% 100% no-repeat; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="PopZukan.dc.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #6B7090; font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"></path><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"></path></svg></span>ずかん</a>
    <a href="PopStamp.dc.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #6B7090; font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.5" r="2.5"></circle><path d="M10.5 8v4M13.5 8v4"></path><path d="M5 16a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2H5z"></path><path d="M5 21.5h14"></path></svg></span>スタンプ</a>

    <a href="PopMinna.dc.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #6B7090; font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16.5 14.2c2.9.3 5 2.5 5 5.8"></path></svg></span>みんな</a>
    <a href="PopSettings.dc.html" aria-current="page" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #0F7A63; font-size: 14px; font-weight: 900"><span style="width: 56px; height: 34px; border-radius: 17px; background: #DDF7F0; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0F7A63" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></span>せってい</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { grade: 5, first: 'three' };
  }
  renderVals() {
    const solid = ['#FF6F9C', '#FF8A3D', '#FFC83D', '#24C3A0', '#4A5AE8', '#8B5CF6'];
    const light = ['#FFE8F0', '#FFEEDF', '#FFF6D6', '#DDF7F0', '#E8EBFF', '#F0E9FF'];
    const whiteText = [false, false, false, false, true, true];
    const grades = [1, 2, 3, 4, 5, 6].map((n, i) => {
      const on = this.state.grade === n;
      const base = 'height: 50px; box-sizing: border-box; border: 3px solid #22223A; border-radius: 16px; font-family: \'Mochiy Pop One\', sans-serif; font-size: 20px; cursor: pointer; padding: 0; ';
      return {
        n: String(n),
        aria: n + 'ねんせい',
        pressed: on ? 'true' : 'false',
        style: on
          ? base + 'background: ' + solid[i] + '; color: ' + (whiteText[i] ? '#FFFFFF' : '#22223A') + '; box-shadow: 0 4px 0 #22223A'
          : base + 'background: ' + light[i] + '; color: #22223A',
        pick: () => this.setState({ grade: n })
      };
    });
    const rOn = 'height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box; border: 3px solid #22223A; border-radius: 20px; background: #E8EBFF; box-shadow: 0 4px 0 #22223A; color: #22223A; font-family: inherit; font-size: 18px; font-weight: 900; cursor: pointer; text-align: left';
    const rOff = 'height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box; border: 3px solid #22223A; border-radius: 20px; background: #FFFFFF; color: #22223A; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer; text-align: left';
    const dOn = 'width: 24px; height: 24px; box-sizing: border-box; flex-shrink: 0; border-radius: 50%; border: 7px solid #4A5AE8; background: #FFFFFF; outline: 2.5px solid #22223A';
    const dOff = 'width: 24px; height: 24px; box-sizing: border-box; flex-shrink: 0; border-radius: 50%; border: 3px solid #22223A; background: #FFFFFF';
    const three = this.state.first === 'three';
    return {
      grades: grades,
      s3: three ? rOn : rOff,
      sW: three ? rOff : rOn,
      d3: three ? dOn : dOff,
      dW: three ? dOff : dOn,
      p3: three ? 'true' : 'false',
      pW: three ? 'false' : 'true',
      pick3: () => this.setState({ first: 'three' }),
      pickW: () => this.setState({ first: 'write' })
    };
  }
}
</script>
