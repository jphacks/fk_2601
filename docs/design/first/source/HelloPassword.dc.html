<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>② パスワード</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22223A}a:hover{color:#22223A}
rt{font-family:'Zen Maru Gothic',sans-serif;font-size:0.5em;font-weight:900;letter-spacing:0}
input::placeholder{color:#8A8FA6}
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.sheet{animation:sheet-up .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes sheet-up{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react,.sheet{animation:none}}
</style>
</helmet>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; color: #22223A; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px; height: 52px">
    <a href="HelloId.dc.html" aria-label="もどる" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 3px solid #22223A; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 0 #22223A; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div role="progressbar" aria-label="とうろく" aria-valuemin="0" aria-valuemax="4" aria-valuenow="2" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><span style="height: 12px; border-radius: 6px; background: #4A5AE8"></span><span style="height: 12px; border-radius: 6px; background: #4A5AE8"></span><span style="height: 12px; border-radius: 6px; background: #E8EBFF"></span><span style="height: 12px; border-radius: 6px; background: #E8EBFF"></span></div>
    <span style="font-family: 'Mochiy Pop One', sans-serif; font-size: 17px; color: #2F3CB8">2/4</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px">
    <img class="navi-react" src="/_blob/62478253a7de77ff82518eb843d6b84b" alt="ナビ（ぎゅっ）" style="width: 112px; height: 112px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 14px 18px; border-radius: 24px; background: #E8EBFF; font-family: 'Mochiy Pop One', sans-serif; font-size: 24px; line-height: 1.55">
      <div style="position: absolute; left: -8px; top: calc(50% - 8px); width: 16px; height: 16px; background: #E8EBFF; transform: rotate(45deg)"></div>
      パスワードを<br>きめてね
    </div>
  </div>

  <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px">
    <label for="pw" style="font-family: 'Mochiy Pop One', sans-serif; font-size: 19px">パスワード</label>
    <div style="display: flex; gap: 8px">
      <input id="pw" type="{{ptype}}" autocomplete="new-password" value="{{pw}}" onChange="{{onPw}}" style="width: 100%; height: 64px; box-sizing: border-box; padding: 0 18px; border: 3px solid #22223A; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-size: 22px; font-weight: 700; color: #22223A">
      <button type="button" onClick="{{toggle}}" style="height: 64px; flex-shrink: 0; padding: 0 14px; box-sizing: border-box; border: 3px solid #22223A; border-radius: 20px; background: #FFFFFF; box-shadow: 0 3px 0 #22223A; font-family: inherit; font-size: 16px; font-weight: 900; color: #22223A; cursor: pointer">{{showLabel}}</button>
    </div>
    <span style="{{lenStyle}}">{{lenText}}</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="pw2" style="font-family: 'Mochiy Pop One', sans-serif; font-size: 19px">もういちど</label>
    <input id="pw2" type="{{ptype}}" autocomplete="new-password" value="{{pw2}}" onChange="{{onPw2}}" style="width: 100%; height: 64px; box-sizing: border-box; padding: 0 18px; border: 3px solid #22223A; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-size: 22px; font-weight: 700; color: #22223A">
    <span style="{{matchStyle}}">{{matchText}}</span>
  </div>
  <div style="display: flex; gap: 10px; padding: 12px 16px; border-radius: 20px; background: #FFF6D6; color: #6E4D00; font-size: 16px; font-weight: 900; line-height: 1.6">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6E4D00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <span>ID と パスワードを わすれると、ずかんに もどれないよ。おうちの ひとと メモしてね</span>
  </div>

  <a href="HelloNickname.dc.html" style="{{cta}}">ID を つくる！</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pw: 'hatena7', pw2: 'hatena7', show: false };
  }
  renderVals() {
    const CTA = "margin-top: auto; margin-bottom: 6px; height: 72px; flex-shrink: 0; box-sizing: border-box; border: 3px solid #22223A; border-radius: 26px; background: #4A5AE8; box-shadow: 0 6px 0 #22223A; color: #FFFFFF; font-family: 'Mochiy Pop One', sans-serif; font-size: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none";
const ctaOf = (ok) => CTA + (ok ? '' : '; opacity: 0.4; pointer-events: none');
    const { pw, pw2, show } = this.state;
    const note = 'font-size: 15px; font-weight: 900; ';
    const lenOk = pw.length >= 6;
    const same = pw2.length > 0 && pw === pw2;
    const differ = pw2.length > 0 && pw !== pw2;
    return {
      pw: pw,
      pw2: pw2,
      ptype: show ? 'text' : 'password',
      showLabel: show ? 'かくす' : 'みる',
      toggle: () => this.setState({ show: !show }),
      onPw: (e) => this.setState({ pw: e.target.value }),
      onPw2: (e) => this.setState({ pw2: e.target.value }),
      lenText: lenOk ? '✓ 6もじ いじょう、OK！' : '6もじ いじょうに してね',
      lenStyle: note + (lenOk ? 'color: #0F7A63' : 'color: #4A4E6A'),
      // 2かいめが ちがうときは その ばで しらせる（パスワードを わすれると もどれないため）
      matchText: same ? '✓ おなじだよ！' : differ ? '1かいめと ちがうよ。もういちど いれてね' : 'おなじ パスワードを もういちど いれてね',
      matchStyle: note + (same ? 'color: #0F7A63' : differ ? 'color: #A12A55' : 'color: #4A4E6A'),
      cta: ctaOf(lenOk && same)
    };
  }
}
</script>
</body>
</html>
