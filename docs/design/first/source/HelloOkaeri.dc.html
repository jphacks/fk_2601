<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>おかえり（つづきから）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22223A}a:hover{color:#22223A}
rt{font-family:'Zen Maru Gothic',sans-serif;font-size:0.5em;font-weight:900;letter-spacing:0}
input::placeholder{color:#8A8FA6}
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.sheet{animation:sheet-up .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes sheet-up{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react,.sheet{animation:none}}
</style>
</helmet>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; color: #22223A; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; height: 52px"><a href="HelloWelcome.dc.html" aria-label="もどる" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 3px solid #22223A; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 0 #22223A; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></div>

  <div style="position: relative; padding: 18px 20px; border-radius: 32px; background: #E8EBFF; display: flex; align-items: center; justify-content: center; gap: 12px; overflow: hidden">
    <img class="navi-react" src="/_blob/814e19e7f3b49ded4c95984ded149bf4" alt="ナビ（はてな）" style="width: 108px; height: 108px; flex-shrink: 0">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Mochiy Pop One', sans-serif; font-weight: 400; font-size: 30px">おかえり！</h1>
      <span style="font-size: 17px; font-weight: 900; line-height: 1.5">まえに きめた ID で<br>ログインしてね</span>
    </div>
  </div>

  <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px">
    <label for="uid" style="font-family: 'Mochiy Pop One', sans-serif; font-size: 19px">ログイン ID</label>
    <input id="uid" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="まえに きめた ID" value="{{id}}" onChange="{{onId}}" style="width: 100%; height: 64px; box-sizing: border-box; padding: 0 18px; border: 3px solid #22223A; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-size: 22px; font-weight: 700; color: #22223A">
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="pw" style="font-family: 'Mochiy Pop One', sans-serif; font-size: 19px">パスワード</label>
    <div style="display: flex; gap: 8px">
      <input id="pw" type="{{ptype}}" autocomplete="current-password" value="{{pw}}" onChange="{{onPw}}" style="width: 100%; height: 64px; box-sizing: border-box; padding: 0 18px; border: 3px solid #22223A; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-size: 22px; font-weight: 700; color: #22223A">
      <button type="button" onClick="{{toggle}}" style="height: 64px; flex-shrink: 0; padding: 0 14px; box-sizing: border-box; border: 3px solid #22223A; border-radius: 20px; background: #FFFFFF; box-shadow: 0 3px 0 #22223A; font-family: inherit; font-size: 16px; font-weight: 900; color: #22223A; cursor: pointer">{{showLabel}}</button>
    </div>
  </div>
  <div style="display: flex; gap: 10px; padding: 12px 16px; border-radius: 20px; background: #FFF6D6; color: #6E4D00; font-size: 16px; font-weight: 900; line-height: 1.6">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6E4D00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <span>わすれちゃったら、おうちの ひとと かいた メモを みてね</span>
  </div>

  <a href="PopHome.dc.html" style="{{cta}}">ログイン</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { id: 'sora2026', pw: 'hatena7', show: false };
  }
  renderVals() {
    const CTA = "margin-top: auto; margin-bottom: 6px; height: 72px; flex-shrink: 0; box-sizing: border-box; border: 3px solid #22223A; border-radius: 26px; background: #4A5AE8; box-shadow: 0 6px 0 #22223A; color: #FFFFFF; font-family: 'Mochiy Pop One', sans-serif; font-size: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none";
const ctaOf = (ok) => CTA + (ok ? '' : '; opacity: 0.4; pointer-events: none');
    const { id, pw, show } = this.state;
    return {
      id: id,
      pw: pw,
      ptype: show ? 'text' : 'password',
      showLabel: show ? 'かくす' : 'みる',
      toggle: () => this.setState({ show: !show }),
      onId: (e) => this.setState({ id: e.target.value }),
      onPw: (e) => this.setState({ pw: e.target.value }),
      cta: ctaOf(id.trim().length > 0 && pw.length > 0)
    };
  }
}
</script>
</body>
</html>
